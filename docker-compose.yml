services:
  api:
    container_name: olho_dagua_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=olho_dagua_db
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@olho_dagua_db:${DB_PORT}/${DB_NAME}
    depends_on:
      - db
      - mosquitto
    restart: unless-stopped

  db:
    container_name: olho_dagua_db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - olho_dagua_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  mosquitto:
    container_name: olho_dagua_broker
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  mqtt-worker:
    container_name: olho_dagua_worker
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/mosquitto/subscriber.js"]
    depends_on:
      - db
      - mosquitto
      - api
    environment:
      - NODE_ENV=production
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=olho_dagua_db
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@olho_dagua_db:${DB_PORT}/${DB_NAME}
    restart: unless-stopped

volumes:
  olho_dagua_db_data:
  mosquitto_data:
  mosquitto_log: